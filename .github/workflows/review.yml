name: Code review

# Deliberately independent of the CI workflow's trigger, which does not fire
# on these events. That way taking a pull request out of draft, or editing
# its description, starts or restarts the review without starting, cancelling
# or invalidating any CI job: a draft run's results carry over to the ready
# PR untouched. The job's own concurrency group cancels a review still
# running when a new one starts.
on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review, edited]

jobs:
  code_review:
    name: Code review
    if: ${{ (github.event.action != 'edited' || github.event.changes.body != null) && github.event.pull_request.draft == false && github.event.pull_request.head.repo.full_name == github.repository }}
    permissions:
      contents: read
      pull-requests: write
    concurrency:
      group: claude-review-${{ github.event.pull_request.number }}
      cancel-in-progress: true
    uses: degory/ghul-code-review/.github/workflows/review.yml@v9
    with:
      idle-timeout-seconds: ${{ fromJSON(vars.CLAUDE_REVIEW_IDLE_TIMEOUT_SECONDS || '90') }}
      max-attempts: ${{ fromJSON(vars.CLAUDE_REVIEW_MAX_ATTEMPTS || '3') }}
      gh-app-id: ${{ vars.GHUL_REVIEWER_APP_ID }}
      ghul-reference: true
      prompt: |
        Review pull request #${{ github.event.pull_request.number }} on ${{ github.repository }}.

        You run in parallel with CI. Whether the diff builds and passes tests is gated by CI before merge — that's not your job. Trust the diff as written.

        Read these files first, in order:
        1. .github/claude-review.md — what this repo is, and what to watch for in it
        2. GHUL.md — ghūl language reference (consult as needed while reading the diff)
    secrets:
      claude-oauth-token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
      qwen-auth-token: ${{ secrets.QWEN_API_KEY }}
      openrouter-auth-token: ${{ secrets.OPENROUTER_API_KEY }}
      zai-auth-token: ${{ secrets.ZAI_API_KEY }}
      gh-app-private-key: ${{ secrets.GHUL_REVIEWER_PRIVATE_KEY }}
